name: Build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew :core:test :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk SwitchRecompHelper-${{ github.ref_name }}.apk
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: SwitchRecompHelper-${{ github.ref_name }}.apk
          generate_release_notes: true
          body: |
            Debug-gesigneerde APK om te testen (Android 8.0+). Je hebt je eigen `prod.keys` en een eigen XCI-dump nodig; de app bevat geen sleutels of spelbestanden.
            Nog niet getest met een echte cartridge-dump: meld fouten met de foutmelding uit de app.
